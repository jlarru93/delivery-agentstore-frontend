workflows:
  ios-dev:
    name: POS PIWI - iOS Dev (dispositivo físico)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 18.20.0
      xcode: 16.2
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: pe.piwi.agent
      groups:
        - firebase_credentials
        - apple_dev                        # Grupo con certificado de desarrollo
      vars:
        BUNDLE_ID: "pe.piwi.agent"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Angular
        script: npm run build:cap

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Setup Firebase iOS
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install --repo-update

      - name: Build IPA (development)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "Debug"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Sin publishing — solo descargas el IPA del artifact