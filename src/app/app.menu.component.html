<div class="layout-sidebar" [ngClass]="{'layout-sidebar-active': appMain.sidebarActive}" (click)="appMain.onSidebarClick($event)" style="z-index: 1004;"
     (mouseover)="appMain.sidebarActive=true" (mouseleave)="appMain.sidebarActive=false">
    <div class="sidebar-logo">
        <a href="#" class="sidebar-pin" title="Toggle Menu" (click)="appMain.onToggleMenuClick($event)">
            <i class="pi pi-lock" *ngIf="appMain.staticMenuActive"></i>
            <i class="pi pi-lock-open" *ngIf="!appMain.staticMenuActive"></i>
        </a>
        <a>
            <img alt="logo" src="assets/images/656.png" />
            <span class="app-name" style="color: #ffffff;">
                Admin 
            </span><br>
            <!--small class="app-name" style="color: #ffffff; font-size: 11.5px; margin-left: 54px;">{{storeFullName}}</small-->
        </a>
    </div>
    <div class="layout-menu-container" (click)="onMenuClick()">
        <ul class="layout-menu">
            <li app-menuitem *ngFor="let item of model; let i = index;" [item]="item" [index]="i" [root]="true"></li>
        </ul>
        <img src="assets/images/Logotipo_TRES22-02.png" alt="" style="position: absolute; width: 280px; margin-bottom: 30px; bottom: 0; margin-left: -31px; z-index: -1;">
    </div>
</div>
