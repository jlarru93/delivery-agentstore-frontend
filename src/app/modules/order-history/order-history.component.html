<p-toolbar>
    <div class="p-toolbar-group-left">
        <h5 class="p-mr-4 p-p-0">Filtro de búsquedas</h5>
        <div class="p-fluid formgrid p-grid">
            
            <div class="p-col-12 p-md-6 p-lg-6">
                <label for="">Número de orden</label>
                 <input type="text" pInputText>
            </div>
            <div class="p-col-12 p-md-6 p-lg-6">
                <label for="">Estado</label>
                <p-dropdown [options]="status" placeholder="Seleccione estado" 
                optionLabel="name" [showClear]="true"></p-dropdown>
            </div>
            <!-- <div class="col-12 md:col-6 lg:col-2">
                <label for="">Facturado</label>
                <p-dropdown [options]="status" [(ngModel)]="tipoSelected" placeholder="Seleccione estado" 
                optionLabel="name" [showClear]="true"></p-dropdown>
            </div> -->
        </div>
    </div>
    
    <div class="p-toolbar-group-right">
        <p-button icon="pi pi-search" type="button" 
        label="Buscar" styleClass="p-button-danger"></p-button>
    </div>
</p-toolbar>
<div class="p-mt-4"></div>

<p-table [value]="orders" [resizableColumns]="true" styleClass="p-datatable-gridlines" >
    <ng-template pTemplate="header">
        <tr>
            <th pResizableColumn>Estado</th>
            <th pResizableColumn>Orden ID</th>
            <th pResizableColumn>Fecha/Hora</th>
            <th pResizableColumn>Valor</th>
            <th pResizableColumn>DM</th>
            <th pResizableColumn>Novedad</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-order>
        <tr>
            <td>{{order.status}}</td>
            <td>{{order.id}}</td>
            <td>{{order.date}}</td>
            <td>{{order.price}}</td>
            <td>{{order.dm}}</td>
            <td><i class="pi pi-eye" (click)="isDialogDetailOpen = true"
                style="color: #17a2b8; font-size: 2rem; cursor: pointer;"></i></td>
        </tr>
    </ng-template>
</p-table>
