<div class="p-grid">
    <div class="p-col-9">
        <agm-map [style]="{height:'89vh'}" [latitude]="center.lat" [longitude]="center.lng" (mapClick)="mapClicked($event)" [zoom]="12">
            <agm-marker [latitude]="marker.lat" [longitude]="marker.lng" [markerDraggable]="true" (dragEnd)="mapClicked($event)"></agm-marker>
        </agm-map>
    </div>
    <div class="p-col-3 information-service">
        <div class="search-container">
            <div class="p-grid p-fluid">
                <div class="p-col-12">
                    <div class="p-ml-5">
                        <label for="">Tienda</label>
                    </div>
                    <div class="input-origin-content">
                        <img src="{{origenIcon}}" class="search-img-origin marker" alt="">
                        <input type="text" class="p-inputtext-lg" pInputText placeholder="¿Dónde lo recogemos?" [(ngModel)]="inputVisible" required autofocus />
                    </div>
                </div>
                <div class="p-col-12">
                    <div class="p-ml-5">
                        <label for="">Dirección de entrega</label>
                    </div>
                    <div class="input-origin-content">
                        <img src="{{destinoIcon}}" class="search-img-origin marker" alt="">
                        <input type="text" class="p-inputtext-lg" pInputText placeholder="¿A dónde lo llevamos?" [(ngModel)]="inputVisibleDestino" required autofocus />
                    </div>
                </div>
                <div *ngIf="inputVisibleDestino " class="p-col-12 input-origin-content">
                    <img class="search-img-origin marker" src="{{referenciaIcon}}" alt="" style="margin-right: 20px;">
                    <input class="p-inputtext-lg" type="text" placeholder="Indicaciones de entrega" pInputText
                     name="input-destino">
                </div>
            </div>
        </div>
        <hr>
        <h5>Detalles</h5>
        <div> 
            <div class="p-grid p-fluid">
                <div class="p-col-12">
                    <div class="p-ml-6">
                        <label for="">Número de cliente</label>
                    </div>
                    <div class="input-origin-content">
                        <div style="padding: 8px;">
                            <i class="pi pi-phone" style="font-size: 1.5rem; color: #212222;"></i>
                        </div>
                        <input class="p-inputtext-lg" type="text" pInputText placeholder="{{userPhone}}" required autofocus disabled value="+51 999 888 777"/>
                        <div class="mr-5"></div>
                    </div>
                </div>
                <div class="p-col-12">
                    <div class="p-ml-6">
                        <label for="">Detalle del pedido</label>
                    </div>
                    <div class="input-origin-content">
                        <div style="padding: 8px;">
                            <i class="pi pi-comment" style="font-size: 1.5rem; color: #212222;"></i>
                        </div>
                        <textarea class="p-inputtext-lg" [rows]="6" [cols]="30" pInputTextarea 
                        [autoResize]="true" placeholder="Escriba aquí..."></textarea>
                        <div class="mr-5"></div>
                    </div>
                </div>
            </div>
        </div>
        <hr>
        <h5>Metodo de pago</h5>
        <div class="content-company">
            <div class="p-grid p-fluid">
                <div class="p-col-12">
                    <p-selectButton class="select-button-custom" [options]="stateOptions" [(ngModel)]="value1" optionLabel="label" optionValue="value"></p-selectButton>
                </div>
            </div>
            <div class="p-mt-3"></div>
            <div class="p-grid">
                <div class="p-col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>DOMICILIO</mat-label>
                        <input matInput placeholder="Placeholder" value="$20.00" [readonly]="true" class="mat-input-custom">
                    </mat-form-field>
                </div>
            </div>
        </div>
        <div class="p-mt-3"></div>
        <div class="p-grid p-fluid">
            <div class="p-col-12">
                <button pButton pRipple class="col-12 p-button-danger p-button-lg" style="position: relative; padding: 1rem;">
                    <label for="">SOLICITAR UN TRES22</label>
                    <span style="position: absolute; right: 2%;">
                        <img src="{{imgLogo}}" class="sign-logo" alt="">
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
